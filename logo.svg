<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc">
<title id="title">Himalayan Odyssey Expedition</title><desc id="desc">HOE monogram with Himalayan mountain silhouettes and gold lettering on a deep forest green background.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102c25"/><stop offset=".52" stop-color="#0b211d"/><stop offset="1" stop-color="#071a17"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c8"/><stop offset=".28" stop-color="#e8c77d"/><stop offset=".58" stop-color="#b88b43"/><stop offset=".82" stop-color="#f7df9d"/><stop offset="1" stop-color="#a87935"/></linearGradient>
 <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e7"/><stop offset="1" stop-color="#e7d6ae"/></linearGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="4"/><feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="405" rx="38" fill="url(#bg)"/>
<rect x="17" y="17" width="1166" height="371" rx="30" fill="none" stroke="url(#gold)" stroke-width="3.2"/>
<rect x="25" y="25" width="1150" height="355" rx="24" fill="none" stroke="#d8b76e" stroke-opacity=".22" stroke-width="1"/>
<path d="M36 205 L132 128 185 167 265 76 337 158 411 94 489 169 566 74 647 166 724 91 800 166 885 72 958 160 1044 96 1164 205Z" fill="#173d34" opacity=".95"/>
<path d="M36 205 L132 128 185 167 265 76 337 158 411 94 489 169 566 74 647 166 724 91 800 166 885 72 958 160 1044 96 1164 205" fill="none" stroke="#8b9d83" stroke-opacity=".52" stroke-width="2"/>
<path d="M226 166 L265 76 306 126 287 115 268 94 249 127Z M376 139 L411 94 449 137 426 123 412 110 394 133Z M522 129 L566 74 612 132 587 115 567 91 547 119Z M684 134 L724 91 764 139 741 123 725 107 707 129Z M846 123 L885 72 928 128 902 111 886 91 868 116Z" fill="#d7e0d3" opacity=".9"/>
<text x="600" y="247" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="236" font-weight="700" letter-spacing="5" fill="url(#ivory)" stroke="#a97b39" stroke-width="1.8" paint-order="stroke fill" filter="url(#shadow)">HOE</text>
<rect x="72" y="190" width="1056" height="70" rx="3" fill="#0b211d" fill-opacity=".97"/>
<path d="M72 190H1128 M72 260H1128" stroke="url(#gold)" stroke-width="2"/>
<text x="600" y="237" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="600" letter-spacing="8.4" fill="url(#ivory)">HIMALAYAN ODYSSEY EXPEDITION</text>
<path d="M510 366H690" stroke="url(#gold)" stroke-width="2" opacity=".7"/>
<circle cx="600" cy="366" r="3" fill="#f1d38c" filter="url(#glow)"/>
