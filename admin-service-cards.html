<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Services Cards Admin | Himalayan Odyssey Expedition</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f6;color:#171717;font:14px/1.6 Arial,sans-serif}header{background:#000;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:inherit}main{max-width:1100px;margin:28px auto;padding:0 16px 60px}h1{font-size:34px}.panel,.item{background:white;border:1px solid #ddd;border-radius:7px;padding:18px;margin:14px 0}label{display:block;font-size:12px;font-weight:bold;margin:12px 0 4px}input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:4px;font:inherit}textarea{min-height:80px}.grid,.items{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{display:grid;grid-template-columns:115px 1fr;gap:12px;margin:0}.item img{width:115px;height:110px;object-fit:cover;background:#eee}button{background:#000;color:#fff;border:1px solid #000;padding:10px 14px;margin:5px 5px 5px 0;cursor:pointer;font-weight:bold}.secondary{background:white;color:#000}.danger{background:#9d2525;border-color:#9d2525}.muted,.status{color:#777;font-size:12px}@media(max-width:650px){.grid,.items{grid-template-columns:1fr}.item{grid-template-columns:90px 1fr}.item img{width:90px;height:90px}}</style></head><body><header><b>HIMALAYAN ODYSSEY EXPEDITION · ADMIN</b><nav><a href="/admin.html">MAIN DASHBOARD</a> · <a href="/services/">VIEW SERVICES</a></nav></header><main><section id="login" class="panel" style="max-width:430px;margin:8vh auto"><h2>Admin Login</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="loginBtn">Login</button><p id="loginStatus" class="status"></p></section><section id="app" hidden><h1>Services Page Cards</h1><p>Edit the four public cards. Save publishes changes when the card is active.</p><div id="cardList" class="items"></div><section class="panel"><h2 id="formTitle">Add Service Card</h2><form id="form"><input id="id" type="hidden"><div class="grid"><div><label>Card group</label><select id="key"><option value="vehicles">Vehicles & Cabs</option><option value="properties">Hotels & Properties</option><option value="packages">Tour Packages</option><option value="b2b">B2B Services</option></select></div><div><label>Eyebrow</label><input id="eyebrow"></div></div><label>Title *</label><input id="title" required><label>Description</label><textarea id="description"></textarea><label>Features (one per line)</label><textarea id="features"></textarea><label>Image (JPG/PNG/WebP, max 5 MB)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><div id="preview" class="muted"></div><div class="grid"><div><label>Primary button label</label><input id="plabel" required></div><div><label>Primary button URL</label><input id="purl" required></div><div><label>Secondary button label</label><input id="slabel"></div><div><label>Secondary button URL</label><input id="surl"></div><div><label>Display order</label><input id="sort" type="number" value="1"></div><div><label><input id="active" type="checkbox" checked style="width:auto"> Show on website</label></div></div><p id="status" class="status"></p><button id="save">Save Card</button><button type="button" id="clear" class="secondary">Clear</button></form></section></section></main><script src="/admin-service-cards.js?v=1"></script></body></html>
