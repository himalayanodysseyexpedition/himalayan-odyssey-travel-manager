<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740" role="img" aria-labelledby="title desc">
<title id="title">Spiti Valley route schematic from Chandigarh</title><desc id="desc">Main route via Shimla, Narkanda, Kinnaur, Nako, Tabo and Kaza. Alternative seasonal exit via Kunzum and Manali. Return on Kinnaur approach in winter. Not a navigation map.</desc>
<rect width="760" height="740" rx="20" fill="#10131b"/><g font-family="Arial,sans-serif" fill="#fff"><text x="40" y="45" font-size="15" letter-spacing="2">HIMALAYAN ODYSSEY EXPEDITION</text><text x="40" y="87" font-size="30" font-weight="bold">Spiti Valley route planner</text><text x="40" y="115" font-size="16" fill="#ddd6fe">Schematic only · not to scale · not live road status</text>
<path d="M100 172 V558" stroke="#a78bfa" stroke-width="5" fill="none"/><path d="M100 558 H440 V395" stroke="#f0c788" stroke-width="4" stroke-dasharray="10 8" fill="none"/><g fill="#a78bfa"><circle cx="100" cy="172" r="8"/><circle cx="100" cy="225" r="8"/><circle cx="100" cy="278" r="8"/><circle cx="100" cy="331" r="8"/><circle cx="100" cy="384" r="8"/><circle cx="100" cy="437" r="8"/><circle cx="100" cy="490" r="8"/><circle cx="100" cy="558" r="11"/></g><g font-size="21"><text x="126" y="179">Chandigarh</text><text x="126" y="232">Shimla</text><text x="126" y="285">Narkanda</text><text x="126" y="338">Rampur</text><text x="126" y="391">Kinnaur</text><text x="126" y="444">Nako / Sumdo</text><text x="126" y="497">Tabo</text><text x="126" y="549" font-weight="bold">Kaza</text></g><text x="126" y="414" font-size="15" fill="#ddd6fe">Sangla / Kalpa detours</text>
<g fill="#f0c788"><circle cx="440" cy="558" r="8"/><circle cx="440" cy="475" r="8"/><circle cx="440" cy="395" r="8"/></g><g font-size="20" fill="#f0c788"><text x="458" y="565">Kunzum Pass</text><text x="458" y="482">Batal / Gramphu</text><text x="458" y="402">Manali</text></g><text x="458" y="515" font-size="14" fill="#fff">Chandratal: optional detour</text><text x="458" y="533" font-size="14" fill="#fff">only when access permits</text>
<text x="40" y="612" font-size="16" fill="#ddd6fe">Solid: usual Shimla–Kinnaur approach; winter return via same side.</text><text x="40" y="639" font-size="16" fill="#f0c788">Dashed: seasonal exit only when officially open and suitable.</text><text x="40" y="678" font-size="15">Check current advisories before travelling. No access is guaranteed.</text><text x="40" y="707" font-size="14" fill="#ddd6fe">himalayanexpedition.co.in · Planning reference, 26 November 2026</text></g></svg>