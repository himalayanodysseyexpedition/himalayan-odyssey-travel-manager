name: Mirror published website photos
on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'
  push:
    branches: [main]
    paths:
      - public-media-sources.json
      - scripts/mirror-public-media.py
      - .github/workflows/mirror-public-media.yml
permissions:
  contents: write
concurrency:
  group: public-media-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download public photos once
        run: python3 scripts/mirror-public-media.py
      - name: Publish static images and lookup map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-media/ public-media-map.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Mirror published photos to Cloudflare static assets"
          git push origin HEAD:main
