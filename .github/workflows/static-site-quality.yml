name: Static site quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
      - name: Validate site metadata and offline shell
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          manifest = json.loads((root / "manifest.webmanifest").read_text())
          assert manifest.get("start_url") == "/", "Unexpected PWA start_url"
          for icon in manifest.get("icons", []):
              assert (root / icon["src"].lstrip("/")).is_file(), f"Missing PWA icon: {icon['src']}"

          ET.parse(root / "sitemap.xml")
          ET.parse(root / "favicon.svg")

          worker = (root / "service-worker.js").read_text()
          for asset in ["/", "/manifest.webmanifest", "/logo.webp", "/favicon.svg",
                        "/mobile-app-experience.css", "/mobile-app-experience.js"]:
              assert asset in worker, f"Offline shell does not list {asset}"
              target = root / asset.lstrip("/")
              assert target.is_file() or asset == "/", f"Offline shell asset missing: {asset}"

          print("Manifest, sitemap, favicon and offline shell checks passed.")
          PY
