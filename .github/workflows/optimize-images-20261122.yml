name: Optimize large website images

on:
  push:
    branches:
      - performance/optimize-images-20261122
    paths:
      - .github/workflows/optimize-images-20261122.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: performance/optimize-images-20261122
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install image processor
        run: npm install --no-save --package-lock=false sharp
      - name: Optimize destination photos and mobile hero
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import fs from 'node:fs/promises';

          const destinations = [
            { file: 'kinnaur.jpg', width: 1600, target: 170 * 1024 },
            { file: 'spiti.jpg', width: 1800, target: 230 * 1024 },
            { file: 'narkanda.jpg', width: 1800, target: 230 * 1024 },
            { file: 'manali.jpg', width: 1800, target: 230 * 1024 }
          ];

          for (const item of destinations) {
            const before = await fs.stat(item.file);
            let best = null;
            for (const quality of [82, 78, 74, 70]) {
              const output = await sharp(item.file)
                .rotate()
                .resize({ width: item.width, height: item.width, fit: 'inside', withoutEnlargement: true })
                .jpeg({ quality, mozjpeg: true, progressive: true })
                .toBuffer();
              best = { output, quality };
              if (output.length <= item.target) break;
            }
            if (best.output.length < before.size) {
              await fs.writeFile(item.file, best.output);
              console.log(item.file + ': ' + (before.size / 1024).toFixed(0) + ' KB -> ' + (best.output.length / 1024).toFixed(0) + ' KB at q' + best.quality);
            } else {
              console.log(item.file + ': original retained; optimized candidate was not smaller');
            }
            if (best.output.length > item.target) {
              console.log(item.file + ': target not reached; kept best visual-quality candidate.');
            }
          }

          const heroSource = 'IMG_8475.jpeg';
          const heroOutput = 'IMG_8475.webp';
          const heroBefore = await fs.stat(heroSource);
          let heroBest = null;
          for (const quality of [82, 78, 74, 70, 66]) {
            const output = await sharp(heroSource)
              .rotate()
              .resize({ width: 1920, height: 1440, fit: 'inside', withoutEnlargement: true })
              .webp({ quality, effort: 5, smartSubsample: true })
              .toBuffer();
            heroBest = { output, quality };
            if (output.length <= 400 * 1024) break;
          }
          await fs.writeFile(heroOutput, heroBest.output);
          console.log(heroSource + ': ' + (heroBefore.size / 1024).toFixed(0) + ' KB -> ' + (heroBest.output.length / 1024).toFixed(0) + ' KB WebP at q' + heroBest.quality);
          NODE
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.jpg' 'IMG_8475.webp'
          if git diff --cached --quiet; then
            echo "No optimized image changes to commit."
          else
            git commit -m "Optimize destination and mobile hero images"
            git push origin HEAD:performance/optimize-images-20261122
          fi
