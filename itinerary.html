<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){
 const db=window.supabase.createClient("https://ynkoiuyjevclypumnyes.supabase.co","sb_publishable_Y4JRhHCbljrd5catiUimJw_tr10Qvk-");
 const root=document.getElementById("itineraryContent"),id=new URLSearchParams(location.search).get("id");
 const safe=v=>String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]});
 const money=v=>{const n=Number(v);return Number.isFinite(n)?"₹"+n.toLocaleString("en-IN"):safe(v)};
 const wa=t=>"https://wa.me/919816929669?text="+encodeURIComponent("Hello Himalayan Odyssey Expedition, I am interested in "+t+". Please share availability and booking details.");
 function fail(){const robots=document.querySelector('meta[name="robots"]');if(robots)robots.content="noindex,follow";root.innerHTML='<div class="status"><h2>Itinerary not available</h2><p>This itinerary may have been unpublished or the link is incorrect. Please contact our team for the latest tour details.</p><a class="btn" href="'+wa("your Himalayan tours")+'" target="_blank" rel="noopener">Ask on WhatsApp</a></div>'}
 if(!id){fail();return}
 (async function(){
  try{
   const r=await db.from("itineraries").select("id,title,destination,duration_days,duration_nights,price,summary,cover_image,gallery_images,published").eq("id",id).eq("published",true).maybeSingle();
   if(r.error)throw r.error;if(!r.data){fail();return}const item=r.data;
   const d=await db.from("itinerary_days").select("day_number,title,description,overnight_location").eq("itinerary_id",id).order("day_number",{ascending:true});if(d.error)throw d.error;
   const days=d.data||[],photos=Array.isArray(item.gallery_images)?item.gallery_images:[],cover=item.cover_image||(photos[0]&&photos[0].url)||"";
   const duration=[item.duration_days?item.duration_days+" Days":"",item.duration_nights!=null?item.duration_nights+" Nights":""].filter(Boolean).join(" / ");
   const title=safe(item.title||"Himalayan Tour Itinerary");
   const dayHtml=days.map(x=>'<article class="day"><div class="day-number">DAY '+safe(x.day_number)+'</div><div class="day-content"><h3>'+safe(x.title||"Explore the journey")+'</h3><p>'+safe(x.description||"Details for this day will be confirmed by our travel team.")+'</p>'+(x.overnight_location?'<span class="overnight">Overnight · '+safe(x.overnight_location)+'</span>':"")+'</div></article>').join("");
   const gallery=photos.length?'<section style="margin-top:38px"><div class="section-kicker">A GLIMPSE OF THE JOURNEY</div><h2>Journey Gallery</h2><div class="gallery">'+photos.map((p,i)=>'<img src="'+safe(p.url)+'" alt="'+title+' photograph '+(i+1)+'" loading="lazy">').join("")+'</div></section>':"";
   document.title=(item.title||"Tour Itinerary")+" | Himalayan Odyssey Expedition";
   const robots=document.querySelector('meta[name="robots"]');if(robots)robots.content="index,follow,max-image-preview:large";
   const canonical=document.querySelector('link[rel="canonical"]');if(canonical)canonical.href=location.origin+"/itinerary.html?id="+encodeURIComponent(id);
   document.querySelector('meta[name="description"]').content=(item.summary||"Explore the day-wise Himalayan tour itinerary with Himalayan Odyssey Expedition.").slice(0,155);
   document.querySelector('meta[property="og:title"]').content=(item.title||"Tour Itinerary")+" | Himalayan Odyssey Expedition";
   document.querySelector('meta[property="og:description"]').content=(item.summary||"Explore this Himalayan tour itinerary.").slice(0,200);
   const shareImage=cover||"https://himalayanexpedition.co.in/spiti.jpg";
   const twitterTitle=document.querySelector('meta[name="twitter:title"]');if(twitterTitle)twitterTitle.content=document.title;
   const twitterDescription=document.querySelector('meta[name="twitter:description"]');if(twitterDescription)twitterDescription.content=(item.summary||"Explore this Himalayan tour itinerary.").slice(0,200);
   const ogImage=document.querySelector('meta[property="og:image"]');if(ogImage)ogImage.content=shareImage;
   const twitterImage=document.querySelector('meta[name="twitter:image"]');if(twitterImage)twitterImage.content=shareImage;
   root.innerHTML='<section class="hero">'+(cover?'<img src="'+safe(cover)+'" alt="'+title+'" onerror="this.remove()">':"")+'<div class="hero-content"><div class="eyebrow">HIMALAYAN ODYSSEY EXPEDITION · SIGNATURE JOURNEY</div><h1>'+title+'</h1><div class="hero-destination">'+safe(item.destination||"Himachal Pradesh, India")+'</div><div class="meta">'+(duration?'<span>'+safe(duration)+'</span>':"")+(days.length?'<span>'+days.length+' planned days</span>':"")+'<span>Local Himalayan travel team</span></div>'+(item.price?'<div class="price">Starting '+money(item.price)+' <small>/ person</small></div>':"")+'</div></section>'+(item.summary?'<section class="intro"><div class="section-kicker">THE EXPERIENCE</div><h2>About This Journey</h2><p>'+safe(item.summary)+'</p></section>':"")+'<section><div class="section-kicker">YOUR JOURNEY, DAY BY DAY</div><h2>Detailed Itinerary</h2><div class="days">'+(dayHtml||'<div class="status">Day-wise details will be shared by our team.</div>')+'</div></section>'+gallery+'<section class="cta"><div><h2>Ready to experience the Himalayas?</h2><p>Ask us about dates, availability, customisations and booking.</p></div><a class="btn" href="'+wa(item.title||"this tour")+'" target="_blank" rel="noopener">Enquire on WhatsApp</a></section>';
   const schema={"@context":"https://schema.org","@type":"TouristTrip","name":item.title,"description":item.summary||"Himalayan tour itinerary","itinerary":days.map(x=>({"@type":"TouristAttraction","name":x.title||("Day "+x.day_number),"description":x.description||""}))};
   const sc=document.createElement("script");sc.type="application/ld+json";sc.textContent=JSON.stringify(schema);document.head.appendChild(sc);
  }catch(e){console.error("Itinerary page error",e);fail()}
 })();
})();
