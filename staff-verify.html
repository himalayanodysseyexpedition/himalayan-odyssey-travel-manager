</style></head><body><header>HIMALAYAN ODYSSEY EXPEDITION</header><main><article><div id="icon" class="icon" aria-hidden="true">…</div><h1 id="title">Verifying your email</h1><p id="message" role="status">Checking your secure verification link.</p><button id="confirm" class="button" type="button" hidden>Verify my email</button><a id="login" class="button" href="/calling-staff.html" hidden>Log in to Calling Desk</a><a id="mail" class="button" style="background:#fff;color:#6536c7;border:1px solid #6536c7;margin-top:12px" href="https://mail.google.com/mail/u/0/#inbox" target="_blank" rel="noopener noreferrer" hidden>Open Gmail</a><small>Calling Staff Portal · Secure account access</small></article></main>
<script>
const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));
const token=params.get('token_hash'),type=params.get('type'),code=params.get('code'),access=hash.get('access_token'),refresh=hash.get('refresh_token'),linkError=params.get('error_code')||hash.get('error_code')||params.get('error')||hash.get('error');
history.replaceState(null,'',location.pathname);
const $=id=>document.getElementById(id);
function finish(ok,title,message){$('title').textContent=title;$('message').textContent=message;$('icon').textContent=ok?'✓':'!';$('icon').className='icon'+(ok?' success':'');$('confirm').hidden=true;$('login').hidden=false;$('mail').hidden=ok;$('login').href='/calling-staff.html'+(ok?'?verified=1':'')}
function unavailable(){finish(false,'Email verification could not be confirmed','This link may have expired or already been used. If you have already verified your email, log in. If not, try signing in and use Resend verification email if prompted.')}
async function verify(){try{if(!window.supabase)throw Error('SDK unavailable');const client=window.supabase.createClient('https://ynkoiuyjevclypumnyes.supabase.co','sb_publishable_Y4JRhHCbljrd5catiUimJw_tr10Qvk-',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'hoe-verification-only'}});
let r;
if(token&&(type==='email'||type==='signup'))r=await client.auth.verifyOtp({token_hash:token,type:type==='signup'?'signup':'email'});
else if(access&&refresh)r=await client.auth.setSession({access_token:access,refresh_token:refresh});
else {unavailable();return}
if(r.error)throw r.error;const {data,error}=await client.auth.getUser();if(error||!data.user?.email_confirmed_at)throw Error('Email confirmation not established');
finish(true,'Email verified successfully','Your email address is confirmed. Tap Log in to Calling Desk and enter the email and password you created.');try{await client.auth.signOut({scope:'local'})}catch(_){}
}catch(e){unavailable()}}
function boot(){if(linkError||(!token&&!access)||code){unavailable();return}if(token){$('title').textContent='Confirm your email';$('message').textContent='Tap below to complete verification securely.';$('confirm').hidden=false;$('confirm').onclick=()=>{$('confirm').disabled=true;$('title').textContent='Verifying your email';verify()}}else verify()}
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4" onload="boot()" onerror="unavailable()"></script></body></html>
